<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comply iV — Client Portal (Audit System prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>

/* ===================== THEME TOKENS (Draft 1 lighter teal) ===================== */
:root{
  --brand:#0E8C7F; --brand-2:#13B5A2; --brand-soft:#E2F2EF; --brand-ink:#0A6A60;
  --ink:#0E1A21; --ink-2:#13242D; --ink-3:#1B313B; --ink-line:#21323A;
  --rust:#c0531f; --rust-soft:#f6e4d8;
  --ok:#16A34A; --warn:#D6920C; --bad:#dc2626; --info:#2F6BFF;
  --grade:#dc2626;

  --bg:#F4F6F4; --surface:#FFFFFF; --surface-2:#FBFCFB; --surface-3:#F1F4F1;
  --txt:#15232B; --txt-2:#647079; --txt-3:#94A0A6; --line:#E6E9E5; --line-2:#EDF0EC;
  --shadow:0 1px 2px rgba(16,30,40,.04),0 6px 22px rgba(16,30,40,.06);
  --shadow-lg:0 12px 40px rgba(16,30,40,.12);
  --radius:14px; --radius-sm:9px; --sidebar-w:248px;
  --display:'Sora',sans-serif; --body:'Plus Jakarta Sans',sans-serif;
  --serif:'Spectral',serif; --mono:'JetBrains Mono',monospace;
}
html[data-theme="dark"]{
  --bg:#0a111c; --surface:#101b29; --surface-2:#0d1623; --surface-3:#16253a;
  --txt:#eef3fa; --txt-2:#9fb0c7; --txt-3:#6b7d96; --line:#1d2c40; --line-2:#1a2840;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 18px 50px rgba(0,0,0,.5);
  --brand-soft:#0c3b37;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;overflow:hidden}
h1,h2,h3,h4,h5{font-family:var(--display);font-weight:700;letter-spacing:-.01em;line-height:1.15}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--txt-3)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ===================== LAYOUT ===================== */
.app{display:flex;height:100vh;width:100vw}
.sidebar{width:var(--sidebar-w);flex:0 0 var(--sidebar-w);background:linear-gradient(185deg,#0E1A21,#0c1f27 60%,#0a2428);color:#cdd9e6;display:flex;flex-direction:column;border-right:1px solid #15212f;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:11px;padding:20px 20px 16px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(145deg,var(--brand-2),var(--brand-ink));display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;color:#04211e;font-size:13px;box-shadow:0 4px 14px rgba(19,181,162,.35)}
.brand-name{font-family:var(--display);font-weight:700;font-size:15.5px;color:#fff;letter-spacing:-.02em}
.brand-name b{color:var(--brand-2)}
.brand-sub{font-size:10px;color:#5f7488;letter-spacing:.14em;text-transform:uppercase;margin-top:1px}
.nav{flex:1;overflow-y:auto;padding:6px 12px 12px}
.nav-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#5a6f84;padding:18px 10px 7px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:10px;color:#aebccd;font-weight:500;font-size:13.5px;cursor:pointer;position:relative;margin-bottom:2px;transition:.16s}
.nav-item:hover{background:#13202e;color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(19,181,162,.18),rgba(19,181,162,.04));color:#fff}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:3px;height:22px;background:var(--brand-2);border-radius:0 4px 4px 0}
.nav-item .ic{width:18px;height:18px;flex:0 0 18px;opacity:.85}
.nav-item.active .ic{opacity:1}
.hardstop{display:flex;align-items:center;gap:15px;background:linear-gradient(120deg,#7f1d1d,#a01f1f);color:#fff;border-radius:var(--radius);padding:15px 18px;margin-bottom:16px;box-shadow:0 6px 22px rgba(127,29,29,.25)}
.hardstop .hs-ic{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none;font-weight:800;font-size:17px;font-family:var(--display)}
.hardstop .hs-t{font-family:var(--display);font-weight:700;font-size:14.5px;letter-spacing:-.01em}
.hardstop .hs-d{font-size:12.5px;color:rgba(255,255,255,.87);margin-top:3px;line-height:1.5;max-width:80ch}
.hardstop .hs-a{margin-left:auto;display:flex;gap:8px;flex:none}
.hardstop .btn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff}
.hardstop .btn:hover{background:rgba(255,255,255,.24)}
.hardstop .btn.w{background:#fff;color:#7f1d1d;border-color:#fff;font-weight:700}
.note-box{padding:13px 15px;border-radius:10px;background:#fdf8ec;border:1px solid #eddfc0;color:#6f4905;font-size:12.5px;line-height:1.6;margin:14px 0}
.note-box b{color:#4a3103}
[data-theme="dark"] .note-box{background:#2a2210;border-color:#4a3d1a;color:#e8d5a8}
.privchip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--brand-ink);background:var(--brand-soft);border:1px solid #bfe3dc;padding:5px 11px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:.15s}
.privchip:hover{border-color:var(--brand-2)}
.privchip .pdot{width:6px;height:6px;border-radius:50%;background:var(--brand);flex:none}
[data-theme="dark"] .privchip{border-color:#1d5c55;color:#7fd8cb}
.prov{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:5px;border:1px solid var(--line);color:var(--txt-3);background:var(--surface-3);white-space:nowrap}
.prov.own{border-color:#b9e0d8;background:var(--brand-soft);color:var(--brand-ink)}
.prov.partner{border-color:#ecd9bd;background:#fdf4e5;color:#8a5a06}
.lawbadge{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border-radius:6px;font-family:var(--display);white-space:nowrap}
.lb-vac{background:#fbeceb;color:var(--bad)} .lb-chg{background:#fdf3e0;color:#8a5a06}
.lb-uns{background:#fdf3e0;color:#8a5a06} .lb-pha{background:#eaf1ff;color:var(--info)}
.lawcard{display:flex;gap:13px;align-items:flex-start;padding:15px 16px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;transition:.15s}
.lawcard:hover{border-color:var(--brand-2);box-shadow:var(--shadow)}
.lawcard h4{font-family:var(--display);font-size:13.5px;margin-bottom:5px}
.lawcard p{font-size:12px;color:var(--txt-2);line-height:1.55}
.lawcard .cite{font-size:11px;color:var(--txt-3);font-style:italic;margin-top:6px}
.dfnum{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.5px}
.thesis{display:flex;gap:18px;align-items:flex-start;background:linear-gradient(120deg,var(--brand-soft),transparent 70%);border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px}
.thesis .th-k{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--brand-ink);font-weight:800;font-family:var(--display)}
.thesis h2{font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-.02em;margin:7px 0 8px;line-height:1.3;color:var(--txt)}
.thesis p{font-size:13px;color:var(--txt-2);line-height:1.65;max-width:95ch}
.forces{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.force{border:1px solid var(--line);border-radius:13px;padding:17px 18px;background:var(--surface);cursor:pointer;transition:.16s;display:flex;flex-direction:column;gap:7px}
.force:hover{border-color:var(--brand);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.force .f-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.force .f-tag{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;font-family:var(--display);color:var(--txt-3);border:1px solid var(--line);padding:2px 7px;border-radius:4px}
.force h4{font-size:14px;font-family:var(--display);line-height:1.35;letter-spacing:-.01em}
.force .f-head{font-size:11.5px;color:var(--brand-ink);font-weight:700;font-family:var(--display);line-height:1.4}
.force p{font-size:12px;color:var(--txt-2);line-height:1.55}
.force .f-go{margin-top:auto;font-size:11.5px;color:var(--brand);font-weight:700;font-family:var(--display);padding-top:8px}
.srcitem{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line-2);align-items:flex-start}
.srcitem:first-child{border-top:none}
.srcitem a{color:var(--brand);font-weight:600;font-size:12.5px;text-decoration:none;font-family:var(--display)}
.srcitem a:hover{text-decoration:underline}
.realchip{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;font-family:var(--display);padding:2px 8px;border-radius:20px;background:rgba(22,163,74,.13);color:var(--ok);text-transform:uppercase;letter-spacing:.06em}
.samplechip2{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;font-family:var(--display);padding:2px 8px;border-radius:20px;background:var(--surface-3);color:var(--txt-3);text-transform:uppercase;letter-spacing:.06em}
@media(max-width:1100px){.forces{grid-template-columns:1fr}}
.cvrow{display:flex;gap:16px;align-items:flex-start;padding:16px 18px;border-top:1px solid var(--line-2);cursor:pointer;transition:.15s}
.cvrow:first-child{border-top:none}
.cvrow:hover{background:var(--surface-2)}
.cvgrade{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;font-family:var(--display);font-size:23px;font-weight:800;flex:none}
.cvhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cvhead h4{font-size:14px;font-family:var(--display)}
.cvline{font-size:12px;color:var(--txt-2);margin-top:5px;line-height:1.55}
.cvret{text-align:right;flex:none;min-width:118px}
.cvladder{display:grid;grid-template-columns:32px 1fr;gap:11px 12px;align-items:start;font-size:12.5px;color:var(--txt-2);line-height:1.55}
.cvladder .lg{font-family:var(--display);font-weight:800;font-size:14px;width:30px;height:28px;border-radius:8px;display:grid;place-items:center}
.dfgrade{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;font-family:var(--display);font-size:23px;font-weight:800;flex:none}
.dfsec{padding:16px 18px;border-top:1px solid var(--line-2)}
.dfsec .dfh{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-3);font-weight:700;margin-bottom:11px}
.kv{display:grid;grid-template-columns:165px 1fr;gap:6px 16px;font-size:12.5px}
.kv dt{color:var(--txt-2)} .kv dd{font-weight:600}
.evrow{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line-2);font-size:12.5px}
.evrow:last-child{border-bottom:none}
.evrow .evd{font-family:var(--mono);color:var(--txt-3);width:100px;flex:none;font-size:11.5px}
.lookup{display:flex;gap:9px;margin-bottom:16px}
.lookup input{flex:1;max-width:330px;padding:11px 15px;border:1px solid var(--line);border-radius:10px;font-family:var(--mono);font-size:14px;background:var(--surface);color:var(--txt)}
.lookup input:focus{outline:none;border-color:var(--brand-2)}
.ctrlscore{display:flex;align-items:center;gap:22px;padding:18px 20px}
.csnum{font-family:var(--display);font-size:52px;font-weight:800;line-height:1;letter-spacing:-2px}
.csbars{display:flex;align-items:flex-end;gap:4px;height:44px;flex:none;width:150px}
.csbars i{flex:1;border-radius:3px 3px 0 0;background:var(--line);display:block}
.csbars i.on{background:var(--brand)}
.nav-item .badge{margin-left:auto;background:var(--rust);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;font-family:var(--display)}
.side-card{margin:12px;padding:14px;border-radius:13px;background:linear-gradient(160deg,#10212c,#0c2b2a);border:1px solid #16383a}
.side-card .sc-tag{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-2);font-weight:700}
.side-card h4{font-family:var(--display);color:#fff;font-size:13.5px;margin:7px 0 5px}
.side-card p{font-size:11.5px;color:#8ea3b6;line-height:1.5}
.side-card .sc-btn{margin-top:11px;width:100%;padding:8px;border-radius:8px;background:var(--brand-2);color:#04211e;font-weight:700;font-size:12px;font-family:var(--display)}
.side-card .sc-btn:hover{background:#2dd4bf}
.side-user{display:flex;align-items:center;gap:10px;padding:13px 16px;border-top:1px solid #15212f}
.avatar{width:32px;height:32px;border-radius:9px;background:linear-gradient(140deg,#22384a,#16505b);display:flex;align-items:center;justify-content:center;font-weight:700;color:#cdeae5;font-size:12px;font-family:var(--display)}
.side-user .su-name{font-size:12.5px;font-weight:600;color:#e4edf5}
.side-user .su-org{font-size:10.5px;color:#62788c}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:62px;flex:0 0 62px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 28px;z-index:20}
.search{flex:1;max-width:440px;display:flex;align-items:center;gap:9px;background:var(--surface-3);border:1px solid var(--line);border-radius:11px;padding:9px 13px;color:var(--txt-3);transition:.15s}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search input{flex:1;border:none;background:none;outline:none;color:var(--txt);font-family:inherit;font-size:13px}
.search .kbd{font-size:10px;color:var(--txt-3);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-family:var(--display)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.freshness{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--txt-2);background:var(--surface-3);border:1px solid var(--line);border-radius:20px;padding:6px 12px}
.freshness .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.18);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--txt-2);transition:.15s;position:relative}
.icon-btn:hover{border-color:var(--brand);color:var(--brand)}
.icon-btn .ndot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--rust);border:2px solid var(--surface)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:10px;font-weight:600;font-size:13px;font-family:var(--display);transition:.15s;border:1px solid transparent}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-ink)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--txt)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}

.scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.page{display:none;padding:30px 34px 70px;max-width:1240px;margin:0 auto;animation:fade .4s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.page-head .ph-eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);font-weight:700;margin-bottom:7px}
.page-head h1{font-size:26px;color:var(--txt)}
.page-head .ph-sub{color:var(--txt-2);font-size:13px;margin-top:6px}
.ph-actions{display:flex;gap:9px;align-items:center}

/* ===================== CARDS ===================== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:22px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}
.card-h h3{font-size:15px;color:var(--txt)}
.card-h .ch-sub{font-size:11px;color:var(--txt-3);font-weight:500;display:flex;align-items:center;gap:6px}
.grid{display:grid;gap:18px}
.muted{color:var(--txt-2)}
.tiny{font-size:11px;color:var(--txt-3)}
.col-2{grid-template-columns:1fr 1fr}
.col-3{grid-template-columns:repeat(3,1fr)}
.col-4{grid-template-columns:repeat(4,1fr)}
.col-2-1{grid-template-columns:2fr 1fr}
.col-1-2{grid-template-columns:1fr 2fr}
@media(max-width:980px){.col-2,.col-3,.col-4,.col-2-1,.col-1-2{grid-template-columns:1fr}}

/* click affordance */
.clickcard{cursor:pointer;transition:.16s;position:relative}
.clickcard:hover{border-color:var(--brand);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.clickcard .chev{position:absolute;top:16px;right:16px;color:var(--txt-3);opacity:0;transition:.16s}
.clickcard:hover .chev{opacity:1;color:var(--brand)}

.src{font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--txt-3);font-weight:600;background:var(--surface-3);border:1px solid var(--line);padding:2px 8px;border-radius:6px;white-space:nowrap}
.weight-pill{font-family:var(--display);font-weight:700;font-size:11px;color:var(--brand-ink);background:var(--brand-soft);padding:2px 8px;border-radius:6px}
html[data-theme="dark"] .weight-pill{color:var(--brand-2)}

.trend{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:12px;font-family:var(--display)}
.trend.up{color:var(--bad)} .trend.down{color:var(--ok)} .trend.flat{color:var(--txt-3)}
.trend.up.good{color:var(--ok)} .trend.down.bad{color:var(--bad)}

/* tooltips (hover + keyboard focus) */
.tip{position:relative;cursor:help;outline:none}
.tip .tip-i{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--txt-3);color:var(--txt-3);font-size:9px;font-weight:700;margin-left:5px;vertical-align:middle;font-family:var(--display);transition:.14s}
.tip:hover .tip-i,.tip:focus .tip-i,.tip:focus-within .tip-i{border-color:var(--brand);color:var(--brand)}
.tip:hover .tip-box,.tip:focus .tip-box,.tip:focus-within .tip-box{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.tip-box{position:absolute;bottom:150%;left:50%;transform:translate(-50%,6px);width:236px;background:var(--ink);color:#dfe8f2;font-size:11.5px;line-height:1.55;padding:11px 13px;border-radius:10px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.18s;z-index:60;font-weight:400;text-transform:none;letter-spacing:0}
.tip-box::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--ink)}
.tip-box b{color:var(--brand-2)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;font-family:var(--display)}
.pill.red{background:rgba(220,38,38,.12);color:var(--bad)}
.pill.amber{background:rgba(214,146,12,.16);color:#946008}
.pill.green{background:rgba(22,163,74,.13);color:var(--ok)}
.pill.teal{background:var(--brand-soft);color:var(--brand-ink)}
.pill.gray{background:var(--surface-3);color:var(--txt-2)}
html[data-theme="dark"] .pill.teal{color:var(--brand-2)}
html[data-theme="dark"] .pill.amber{color:var(--warn)}

/* ===================== HERO ===================== */
.hero{display:grid;grid-template-columns:330px 1fr;gap:0;overflow:hidden;position:relative}
.hero-grade{background:linear-gradient(165deg,#0E1A21,#0c2330 70%,#0a2a2c);color:#fff;padding:28px 26px 26px;position:relative;overflow:hidden}
.hero-grade::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(19,181,162,.16),transparent 70%)}
.hg-tag{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7d93a6;font-weight:700;position:relative}
.gauge-wrap{position:relative;width:230px;height:150px;margin:10px auto 2px}
.gauge-num{position:absolute;left:0;right:0;bottom:8px;text-align:center}
.gauge-grade{font-family:var(--display);font-size:62px;font-weight:800;line-height:1;color:#fff}
.gauge-label{font-family:var(--display);font-size:16px;font-weight:700;text-align:center;color:#fff;margin-top:4px}
.gauge-expo{text-align:center;margin-top:7px}
.gauge-expo b{font-family:var(--display);font-size:30px;font-weight:800}
.gauge-expo span{font-size:11px;color:#8aa0b2;letter-spacing:.08em}
.hg-band{display:flex;gap:4px;margin-top:18px}
.hg-band .b{flex:1;height:6px;border-radius:3px;opacity:.3}
.hg-band .b.on{opacity:1}
.hg-scale{display:flex;justify-content:space-between;font-size:9.5px;color:#6f8497;margin-top:6px;letter-spacing:.04em}

.hero-body{padding:30px 30px;display:flex;flex-direction:column;justify-content:center}
.hb-eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--rust);font-weight:700;margin-bottom:10px}
.hb-headline{font-family:var(--display);font-size:20px;font-weight:600;color:var(--txt);line-height:1.25}
.hb-headline .big{font-size:50px;font-weight:800;letter-spacing:-.02em;display:inline-block;vertical-align:-6px;margin-right:6px}
.hb-headline .big small{font-size:18px;color:var(--txt-3)}
.statchips{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.statchip{border:1px solid var(--line);border-radius:11px;padding:11px 14px;min-width:120px}
.statchip .sc-v{font-family:var(--display);font-size:21px;font-weight:800}
.statchip .sc-l{font-size:10.5px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;display:flex;align-items:center}

/* vectors */
.vec{display:grid;grid-template-columns:230px 1fr 70px;align-items:center;gap:18px;padding:16px 10px;border-top:1px solid var(--line-2);margin:0 -10px;border-radius:10px;cursor:pointer;transition:.14s}
.vec:hover{background:var(--surface-3)}
.vec:first-of-type{border-top:none}
.vec-name{font-family:var(--display);font-weight:600;font-size:13.5px;color:var(--txt);display:flex;align-items:center}
.vec-meta{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap}
.vec-bar{height:9px;background:var(--surface-3);border-radius:6px;overflow:hidden}
.vec-bar .fill{height:100%;border-radius:6px;width:0;transition:width 1.1s cubic-bezier(.4,0,.2,1)}
.vec-score{text-align:right;font-family:var(--display);font-weight:800;font-size:24px;color:var(--txt)}
.vec-score small{font-size:11px;color:var(--txt-3);font-weight:600}

/* kpi */
.kpi{padding:18px 18px}
.kpi .k-tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--txt-3);font-weight:700;display:flex;align-items:center}
.kpi .k-val{font-family:var(--display);font-size:30px;font-weight:800;color:var(--txt);margin:8px 0 4px;line-height:1}
.kpi .k-val small{font-size:16px;color:var(--rust)}
.kpi .k-foot{font-size:11.5px;color:var(--txt-2);display:flex;align-items:center;gap:6px}

/* recs / activity */
.rec{display:flex;gap:13px;padding:14px 10px;border-top:1px solid var(--line-2);align-items:center;margin:0 -10px;border-radius:10px;cursor:pointer;transition:.14s}
.rec:hover{background:var(--surface-3)}
.rec:first-of-type{border-top:none}
.rec .rec-rank{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--brand-soft);color:var(--brand-ink);font-family:var(--display);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
html[data-theme="dark"] .rec .rec-rank{color:var(--brand-2)}
.rec h4{font-size:13.5px;color:var(--txt);font-family:var(--display);font-weight:600}
.rec .rec-impact{margin-left:auto;text-align:right;flex:0 0 auto}
.rec .rec-impact b{font-family:var(--display);font-size:15px}
.rec .rec-impact span{display:block;font-size:10px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.05em}
.locked{filter:grayscale(.3);opacity:.7}

.act{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--line-2);align-items:center}
.act:first-child{border-top:none}
.act .act-dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.act .act-txt{font-size:12.5px;color:var(--txt);line-height:1.45}
.act .act-txt b{font-weight:600}
.act .act-time{margin-left:auto;font-size:11px;color:var(--txt-3);white-space:nowrap;flex:0 0 auto;font-family:var(--display)}

/* tables */
table.tbl{width:100%;border-collapse:collapse}
table.tbl th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--txt-3);font-weight:700;padding:0 14px 12px;border-bottom:1px solid var(--line)}
table.tbl td{padding:14px;border-bottom:1px solid var(--line-2);font-size:13px;color:var(--txt);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr.clickrow{cursor:pointer;transition:.12s}
table.tbl tr.clickrow:hover td{background:var(--surface-3)}
.lawyer{font-weight:600}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.meter{height:8px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.meter .mf{height:100%;border-radius:6px}
.bench{display:grid;grid-template-columns:150px 1fr 60px;gap:14px;align-items:center;padding:11px 0;border-top:1px solid var(--line-2)}
.bench:first-child{border-top:none}
.bench .bl{font-size:12.5px;color:var(--txt);font-weight:500}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--txt-2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* feature tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:980px){.tiles{grid-template-columns:1fr}}
.tile{border:1px solid var(--line);border-radius:13px;padding:18px;cursor:pointer;transition:.16s;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--brand);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.tile .t-ic{width:36px;height:36px;border-radius:10px;background:var(--brand-soft);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
html[data-theme="dark"] .tile .t-ic{color:var(--brand-2)}
.tile h4{font-size:14px;font-family:var(--display)}
.tile .t-meta{font-size:11.5px;color:var(--txt-3)}
.tile .t-go{margin-top:auto;font-size:12px;color:var(--brand);font-weight:700;font-family:var(--display);padding-top:10px}

/* frow */
.frow{display:flex;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);transition:.14s;margin-bottom:10px}
.frow:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.frow .ficon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 36px;font-weight:700}
.frow .fname{font-weight:600;font-size:13px;color:var(--txt)}
.frow .fmeta{font-size:11px;color:var(--txt-3)}
.frow .fact{margin-left:auto;display:flex;gap:8px}

/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:0 0 20px}
.tl-item:last-child{padding-bottom:0}
.tl-item .tl-dot{position:absolute;left:-23px;top:2px;width:14px;height:14px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.tl-item h4{font-size:13.5px;font-family:var(--display);color:var(--txt)}
.tl-item .tl-date{font-size:11px;color:var(--txt-3);font-family:var(--display);margin-bottom:3px}
.tl-item p{font-size:12px;color:var(--txt-2);line-height:1.5;margin-top:2px}

.like-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.like-num{font-family:var(--display);font-size:40px;font-weight:800;line-height:1;color:var(--bad)}

.seg{display:inline-flex;background:var(--surface-3);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{padding:5px 13px;border-radius:7px;font-size:12px;font-weight:600;color:var(--txt-2);font-family:var(--display)}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}

/* upsell slim */
.upsell{background:linear-gradient(150deg,#0E1A21,#10242e 70%,#0b2a2b);color:#fff;border-radius:var(--radius);padding:22px 26px;position:relative;overflow:hidden;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.upsell::after{content:"";position:absolute;right:-40px;bottom:-60px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(192,83,31,.18),transparent 70%)}
.upsell .up-tag{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust);font-weight:700;position:relative}
.upsell h3{font-family:var(--serif);font-weight:600;font-size:19px;color:#fff;margin-top:5px;position:relative;max-width:520px}
.upsell .up-cta{position:relative;margin-left:auto}
.upsell .up-cta .btn{background:var(--rust);color:#fff}
.upsell .up-cta .btn:hover{background:#a8461a}

/* drawer */
.drawer-bg{position:fixed;inset:0;background:rgba(8,15,25,.5);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.25s;z-index:90}
.drawer-bg.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:460px;max-width:94vw;background:var(--surface);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:.3s cubic-bezier(.4,0,.2,1);z-index:100;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer.open{transform:none}
.drawer-h{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.drawer-h .dh-tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);font-weight:700}
.drawer-b{flex:1;overflow-y:auto;padding:24px}
.drawer-b .d-lede{font-family:var(--serif);font-size:17px;line-height:1.45;color:var(--txt);margin-bottom:16px}
.drawer-b p{font-size:13px;color:var(--txt-2);line-height:1.65;margin-bottom:14px}
.drawer-b h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--txt-3);margin:18px 0 10px}
.drawer-row{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.drawer-row .dr-k{color:var(--txt-3)}
.drawer-row .dr-v{color:var(--txt);font-weight:600;text-align:right}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:11px;font-size:13px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.3s;z-index:200;display:flex;align-items:center;gap:10px;font-weight:500}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .t-ic{color:var(--brand-2)}
/* v8: sample chip, persistent disclaimer, direction tags, what's-new */
.samplechip{font-size:10.5px;font-weight:600;color:var(--txt-3);background:var(--surface-3);border:1px dashed var(--line);border-radius:20px;padding:5px 11px;white-space:nowrap;cursor:default}
.disclaimer{margin-top:30px;padding:12px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:11px;color:var(--txt-3);line-height:1.5}
.disclaimer svg{width:15px;height:15px;flex:0 0 15px;color:var(--txt-3)}
.dirtag{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:5px;font-family:var(--display)}
.dirtag.worse{background:rgba(220,38,38,.1);color:var(--bad)}
.dirtag.better{background:rgba(22,163,74,.12);color:var(--ok)}
.win{display:flex;gap:13px;padding:14px 0;border-top:1px solid var(--line-2);align-items:flex-start}
.win:first-of-type{border-top:none}
.win .win-ic{width:30px;height:30px;flex:0 0 30px;border-radius:8px;background:rgba(22,163,74,.12);color:var(--ok);display:flex;align-items:center;justify-content:center}
.win h4{font-size:13.5px;font-family:var(--display)}
.win p{font-size:12px;color:var(--txt-2);margin-top:2px;line-height:1.5}
.win .win-val{margin-left:auto;text-align:right;flex:0 0 auto;font-family:var(--display);font-weight:800;color:var(--ok);font-size:14px}
.owner{display:inline-flex;align-items:center;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:5px;font-family:var(--display)}
.owner.you{background:var(--brand-soft);color:var(--brand-ink)}
.owner.we{background:rgba(47,107,255,.12);color:var(--info)}
.owner.law{background:rgba(192,83,31,.12);color:var(--rust)}
html[data-theme="dark"] .owner.you{color:var(--brand-2)}
.indcard{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s;background:var(--surface)}
.indcard:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.indcard .iv{font-family:var(--display);font-weight:800;font-size:20px}
.indcard .il{font-size:11.5px;color:var(--txt-2)}

/* track-record scale — visually distinct from the exposure grade */
.trk-scale{display:flex;gap:8px}
.trk-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10.5px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.04em;text-align:center}
.trk-pill{width:100%;height:8px;border-radius:5px;opacity:.32}
.trk-step.on .trk-pill{opacity:1}
/* linear meter */
.tmeter{position:relative;height:12px;border-radius:8px;background:linear-gradient(90deg,var(--ok),var(--warn) 55%,var(--bad));box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
.tmark{position:absolute;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:var(--shadow)}
/* monitoring: live pulse + event-annotated history markers */
.livedot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 0 3px rgba(22,163,74,.18);animation:pulse 2.4s infinite}
.histwrap{position:relative;width:100%}
#histMarkers{position:absolute;top:0;left:0;pointer-events:none}
.hmark{position:absolute;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:var(--surface);border:2px solid var(--bad);display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;padding:0;transition:.14s;box-shadow:var(--shadow)}
.hmark:hover{transform:translate(-50%,-50%) scale(1.25);z-index:5}
.hmark span{width:7px;height:7px;border-radius:50%;display:block}
.srcrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
@media(max-width:980px){.srcrow{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1080px){.hero{grid-template-columns:1fr}}
@media(max-width:760px){.sidebar{display:none}.vec{grid-template-columns:1fr 60px}.vec .vec-bar-wrap{display:none}}

/* ===================== v2.0 ADDITIONS ===================== */
.layertag{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--brand-2);opacity:.9}
.instrcode{font-family:var(--mono);font-size:10px;color:var(--txt-3);letter-spacing:.02em}
.icode-chip{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--txt-2);background:var(--surface-3);border:1px solid var(--line);padding:2px 6px;border-radius:4px;vertical-align:middle}

/* propagation matrix */
.matwrap{overflow-x:auto}
table.mat{border-collapse:collapse;width:100%;min-width:720px;font-size:12.5px}
table.mat th,table.mat td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line-2)}
table.mat thead th{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--txt-3);font-weight:600;background:var(--surface-3);border-bottom:1px solid var(--line)}
table.mat th.rowh{text-align:left;font-weight:600;color:var(--txt);font-size:12.5px;letter-spacing:0;text-transform:none;background:transparent;white-space:nowrap}
table.mat tbody tr:last-child td,table.mat tbody tr:last-child th{border-bottom:none}
.cell{display:inline-block;min-width:54px;padding:3px 7px;border-radius:5px;font-family:var(--mono);font-size:11.5px;font-weight:500}
.cell.fast{background:#dcfce7;color:#14532d}
.cell.okc{background:var(--brand-soft);color:var(--brand-ink)}
.cell.slow{background:#fef3c7;color:#78350f}
.cell.never{background:#fee2e2;color:#991b1b;font-weight:600;letter-spacing:.06em}
html[data-theme="dark"] .cell.fast{background:#14532d;color:#bbf7d0}
html[data-theme="dark"] .cell.slow{background:#78350f;color:#fde68a}
html[data-theme="dark"] .cell.never{background:#7f1d1d;color:#fecaca}

/* surface grade rows */
.sgrade{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;font-family:var(--display);font-weight:800;font-size:12px;flex:none}
.sg-a{background:#dcfce7;color:#14532d}.sg-b{background:var(--brand-soft);color:var(--brand-ink)}
.sg-c{background:#fef3c7;color:#78350f}.sg-d{background:#ffedd5;color:#9a3412}.sg-f{background:#fee2e2;color:#991b1b}
html[data-theme="dark"] .sg-a{background:#14532d;color:#bbf7d0}html[data-theme="dark"] .sg-c{background:#78350f;color:#fde68a}
html[data-theme="dark"] .sg-d{background:#7c2d12;color:#fed7aa}html[data-theme="dark"] .sg-f{background:#7f1d1d;color:#fecaca}

/* factor bars */
.fbar{height:7px;border-radius:20px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.fbar span{display:block;height:100%;border-radius:20px}
.frow2{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:baseline}
.fmul{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fmulc{background:var(--surface-3);border-radius:var(--radius-sm);padding:12px 14px;text-align:center}
.fmulc b{display:block;font-family:var(--mono);font-size:18px;color:var(--txt);font-weight:500}
.fmulc small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-3)}

/* boundary columns */
.bcol{border-top:2px solid var(--line);padding-top:14px}
.bcol.we{border-top-color:var(--brand)}
.bcol.you{border-top-color:var(--rust)}
.bcol.non{border-top-color:var(--txt-3)}
.bcol h4{font-size:13.5px;margin-bottom:4px}
.bcol .bl{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--txt-3);font-weight:600;margin-bottom:10px}
.bcol ul{list-style:none;font-size:12.5px;color:var(--txt-2);line-height:1.5}
.bcol li{padding:7px 0;border-bottom:1px solid var(--line-2)}
.bcol li:last-child{border-bottom:none}

/* ladder */
.ladder{display:flex;flex-direction:column;gap:8px}
.lrung{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:13px 16px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface)}
.lrung.done{background:var(--brand-soft);border-color:transparent}
.lrung .ln{font-family:var(--mono);font-size:11px;color:var(--txt-3);width:16px}
.lrung h5{font-size:13.5px;font-family:var(--display);font-weight:700}
.lrung p{font-size:12px;color:var(--txt-2);margin-top:2px}
.lrung .lp{font-family:var(--mono);font-size:12px;color:var(--txt-2);white-space:nowrap}

/* coverage strip */
.covstrip{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;margin-top:4px}
.covm{height:34px;border-radius:4px;background:var(--brand);display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px}
.covm span{font-family:var(--mono);font-size:8.5px;color:#fff;opacity:.9}
.covm.pre{background:var(--surface-3);border:1px dashed var(--line)}
.covm.pre span{color:var(--txt-3)}
@media(max-width:980px){.covstrip{grid-template-columns:repeat(6,1fr)}}
.badge.teal{background:var(--brand);color:#fff}
.lookup .search-in{flex:1;max-width:330px;padding:11px 15px;border:1px solid var(--line);border-radius:10px;font-family:var(--mono);font-size:14px;background:var(--surface);color:var(--txt)}
.lookup .search-in:focus{outline:none;border-color:var(--brand-2)}

function openDrawer(tag, title, html){ $("#drawerTag").textContent=tag; $("#drawerTitle").textContent=title; $("#drawerBody").innerHTML=html; $("#drawer").classList.add("open"); $("#drawerBg").classList.add("open"); }
function closeDrawer(){ $("#drawer").classList.remove("open"); $("#drawerBg").classList.remove("open"); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeDrawer(); });

function openDomain(code){
  const d=DOM[code]; if(!d) return;
  const sc = d.excluded?'Client list':d.score==null?'Not measured':`${d.score.toFixed(1)} · grade ${gradeOf(d.score)}`;
  const w = n => d.total? (n/d.total*100) : 0;
  openDrawer(`${d.code} · ${d.family}`, d.name, `
    <p class="d-lede">${esc(d.what)}</p>
    <div class="drawer-row"><div class="dr-k">Domain score</div><div class="dr-v"><b>${sc}</b></div></div>
    <h4>Checkpoints</h4>
    <div class="cpseg"><i style="width:${w(d.pass)}%;background:var(--ok)"></i><i style="width:${w(d.warn)}%;background:var(--warn)"></i><i style="width:${w(d.fail)}%;background:var(--bad)"></i><i style="width:${w(d.notrun)}%;background:var(--line)"></i></div>
    <div class="cplegend"><div><b>${d.pass}</b>Pass</div><div><b>${d.warn}</b>Warn</div><div><b>${d.fail}</b>Fail</div><div><b>${d.notrun}</b>Not run</div></div>
    <p class="tiny" style="margin-top:8px">${d.run} of ${d.total} checkpoints ran. Excluded checkpoints are listed with the source they need.</p>
    <h4>Top finding</h4><p>${esc(d.finding)}</p>
    <h4>Metrics</h4>${d.metrics.length?d.metrics.map(c=>`<div class="drawer-row" style="cursor:pointer" onclick="openMetric('${c}')"><div class="dr-k"><span class="mono">${c}</span> ${METRICS[c][0]}</div><div class="dr-v"><b>${METRICS[c][1]}</b></div></div>`).join(""):'<p class="tiny">Scored from checkpoints only.</p>'}
    <h4>Evidence sources</h4><p class="tiny">${esc(d.sources)}</p>`);
}
function openMetric(c){
  const m=METRICS[c]; if(!m) return; const ds=domainsOf(c);
  openDrawer(`Metric ${c}`, m[0], `
    <div class="drawer-row"><div class="dr-k">This period</div><div class="dr-v"><b style="font-size:20px;font-family:var(--display)">${m[1]}</b></div></div>
    <p class="tiny">${m[2]}</p>
    <h4>Definition</h4><p>${m[3]}</p>
    <h4>Feeds domains</h4><div style="display:flex;gap:6px;flex-wrap:wrap">${ds.length?ds.map(x=>`<span class="dcode" onclick="openDomain('${x}')">${x} · ${esc(DOM[x].name)}</span>`).join(""):'<span class="tiny">Lead Inspector metric</span>'}</div>
    <p class="tiny" style="margin-top:14px">Shown to one decimal place; grades apply to the unrounded value. A missing source shows “not measured”, never zero.</p>`);
}
function openContact(id){
  const c=CONTACTS.find(x=>x.id===id); if(!c) return; const k=c.code;
  let failAt = k==='VF_OK'?6 : (k==='NP_NO_CONSENT_TEXT'||k==='NP_PRETICKED')?3 : k.startsWith('NP_')?1 : ['CF_NOT_FOUND','CF_EXPIRED','CF_FILE_MISSING'].includes(k)?2 : k.startsWith('CF_')?4 : 5;
  const steps=['Applicable proof exists','Proof opens at its source','Proof content is consent','Sources agree','Completeness'].map((n,i)=>{ const s=i+1;
    const r = s<failAt?['Pass','green']: s===failAt?(s===5?['Gap','amber']:['Fails','red']):['Not reached','gray'];
    return `<div class="chk"><span><span class="n">${s}</span>${n}</span><span class="pill ${r[1]}">${r[0]}</span></div>`; }).join("");
  openDrawer(`${c.time} · ${c.ch} · ${c.cat}`, c.phone, `
    <div class="drawer-row"><div class="dr-k">Consent status</div><div class="dr-v">${st(c.status)}</div></div>
    <div class="drawer-row"><div class="dr-k">Primary reason</div><div class="dr-v"><span class="mono tiny">${c.code}</span></div></div>
    <p class="tiny" style="margin:6px 0 4px">${CODE[c.code]}</p>
    <h4>Consent checks</h4>${steps}
    <h4>Other domains</h4>${c.flags.length?c.flags.map(f=>`<span class="flag">${f}</span>`).join(""):'<p class="tiny">No other domain flagged this contact.</p>'}
    <h4>Proof and evidence</h4>
    <div class="drawer-row"><div class="dr-k">Legal basis</div><div class="dr-v">${BASIS[c.basis]}</div></div>
    <div class="drawer-row"><div class="dr-k">Proof used</div><div class="dr-v">${esc(c.proof)}</div></div>
    <div class="drawer-row"><div class="dr-k">Source grade</div><div class="dr-v">${c.grade}</div></div>
    <div class="drawer-row"><div class="dr-k">Hash</div><div class="dr-v mono tiny">sha256 ${c.hash}</div></div>
    <button class="btn btn-primary" style="margin-top:14px" onclick="toast('Evidence file queued')">Export evidence file</button>`);
}

$("#gsearch").addEventListener("keydown",e=>{
  if(e.key!=='Enter') return; const q=e.target.value.trim().toUpperCase();
  if(DOM[q]) return openDomain(q);
  const mk = Object.keys(METRICS).find(k=>k.toUpperCase()===q); if(mk) return openMetric(mk);
  const dn = DOMAINS.find(d=>d.name.toUpperCase().includes(q)); if(dn&&q) return openDomain(dn.code);
  toast('Try a domain code (REV), a metric (M08) or a domain name');
});
